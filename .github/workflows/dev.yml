name: Deploy to DEV

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/graphics/**'
      - '.github/**'
      - '!.github/workflows/**'
  workflow_dispatch:
    inputs:
      force_build_all:
        description: "Force rebuild all images regardless of changes"
        type: boolean
        default: false
        required: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.package }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: backend
            build_context: .
            build_file: Dockerfile
            triggers: "('src/' 'package.json' 'bun.lock' 'vite.config.js' 'tsconfig.json' 'tsconfig.base.json' 'Dockerfile')"
          - package: migrations
            build_context: .
            build_file: Dockerfile.migrations
            triggers: "('migrations/' 'src/services/database/' 'Dockerfile.migrations')"
          - package: seed
            build_context: .
            build_file: Dockerfile.seed
            triggers: "('scripts/' 'src/services/database/' 'Dockerfile.seed' 'package.json' 'bun.lock')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve triggers
        id: triggers
        run: |
          if [[ "${{ inputs.force_build_all }}" == "true" ]]; then
            echo "value=" >> $GITHUB_OUTPUT
          else
            echo "value=${{ matrix.triggers }}" >> $GITHUB_OUTPUT
          fi

      - name: Build or retag ${{ matrix.package }}
        uses: bcgov/action-builder-ghcr@cb2629351c87dd1c2130073e4ebb7233a9653a63 # v4.4.1
        with:
          package: ${{ matrix.package }}
          build_context: ${{ matrix.build_context }}
          build_file: ${{ matrix.build_file }}
          tags: |
            latest
            ${{ github.sha }}
          tag_fallback: latest
          diff_branch: 'HEAD^'
          triggers: ${{ steps.triggers.outputs.value }}

  deploy:
    name: Deploy (DEV)
    needs: build
    if: |
      always() &&
      !contains(needs.build.result, 'failure') &&
      !contains(needs.build.result, 'cancelled')
    uses: ./.github/workflows/.deployer.yml
    secrets:
      oc_namespace: ${{ secrets.OC_NAMESPACE }}
      oc_token: ${{ secrets.OC_TOKEN }}
      keycloak_url: ${{ secrets.KEYCLOAK_URL }}
      keycloak_realm: ${{ secrets.KEYCLOAK_REALM }}
      keycloak_client_id: ${{ secrets.KEYCLOAK_CLIENT_ID }}
      siteminder_logout_url: ${{ secrets.SITEMINDER_LOGOUT_URL }}
      hmcr_api_url: ${{ secrets.HMCR_API_URL }}
      hmcr_token_url: ${{ secrets.HMCR_TOKEN_URL }}
      hmcr_id: ${{ secrets.HMCR_ID }}
      hmcr_secret: ${{ secrets.HMCR_SECRET }}
      bc_route_planner_api_key: ${{ secrets.BC_ROUTE_PLANNER_API_KEY }}
      google_maps_client_api_key: ${{ secrets.GOOGLE_MAPS_CLIENT_API_KEY }}
      base_map_style_url: ${{ secrets.BASE_MAP_STYLE_URL }}
      seed_s3_endpoint_url: ${{ secrets.SEED_S3_ENDPOINT_URL }}
      seed_s3_bucket: ${{ secrets.SEED_S3_BUCKET }}
      seed_s3_access_key: ${{ secrets.SEED_S3_ACCESS_KEY }}
      seed_s3_secret_key: ${{ secrets.SEED_S3_SECRET_KEY }}
    with:
      environment: dev
      backend_tag: ${{ github.sha }}
      migrations_tag: ${{ github.sha }}
      seed_tag: ${{ github.sha }}
      params: --set global.secrets.persist=false --set backend.seed.enabled=true --set backend.ingress.host=wisr-dev.apps.gold.devops.gov.bc.ca
      db_triggers: ('charts/crunchy/')

  results:
    name: Dev Results
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: echo "At least one job has failed." && exit 1
      - run: echo "Success!"
